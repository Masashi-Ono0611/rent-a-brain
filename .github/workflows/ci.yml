name: ci
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deterministic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Install the pinned npm version without lifecycle scripts
        run: npm install --global --ignore-scripts "npm@$(node -p 'JSON.parse(require("node:fs").readFileSync("config/tooling-pins.json", "utf8")).npm')"
      - name: Install the checksum-verified pinned scanner
        run: bash .github/scripts/install-gitleaks.sh
      - run: npm ci --ignore-scripts
      - run: npm run check:toolchain
      - run: npm run typecheck
      - run: npm run check:boundaries
      - run: npm test
      - run: npm run check:secrets
      - run: git diff --check
